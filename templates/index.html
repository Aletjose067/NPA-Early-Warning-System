<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPA Early Warning System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container py-5">

    <div class="card shadow-lg">

        <h1 class="text-center mb-4">
            🏦 NPA EARLY WARNIING SYSTEM
        </h1>

        <h5 class="text-center text-muted mb-4">
            Banking Risk Prediction Dashboard
        </h5>

        <form action="/predict" method="post">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text" class="form-control"
                           name="customer_name" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Customer ID</label>
                    <input type="text" class="form-control"
                           name="customer_id" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control"
                           name="email" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="text" class="form-control"
                           name="mobile" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Age</label>
                    <input type="number" step="any"
                           class="form-control"
                           name="age" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Sanction Limit</label>
                    <input type="number" step="any"
                           class="form-control"
                           name="sanct_lim" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Overdue Amount</label>
                    <input type="number" step="any"
                           class="form-control"
                           name="overdue_amt" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Balance Outstanding</label>
                    <input type="number" step="any"
                           class="form-control"
                           name="balance_os" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Total Transactions</label>
                    <input type="number"
                           class="form-control"
                           name="total_transactions" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">
                        Total Transaction Amount
                    </label>

                    <input type="number" step="any"
                           class="form-control"
                           name="total_transaction_amount" required>
                </div>

                <div class="col-md-12 mb-4">
                    <label class="form-label">
                        Average Transaction Amount
                    </label>

                    <input type="number" step="any"
                           class="form-control"
                           name="avg_transaction_amount" required>
                </div>

            </div>

            <div class="text-center">

                <button class="btn btn-primary btn-lg">
                    Analyze NPA Risk
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
